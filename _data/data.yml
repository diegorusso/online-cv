career-profile:
    title: Career Profile
    summary: |
      CPython Core Developer and Principal Software Engineer in Arm's Runtimes
      team, based in Cambridge, UK. 20+ years in software engineering, using
      Python since 2006 and contributing to CPython since 2023, with a focus on
      interpreter performance, JIT-related work, CI infrastructure, and
      ensuring CPython and its ecosystem run reliably and efficiently on Arm
      platforms. Work sits at the intersection of runtime, performance
      engineering, and large-scale open-source collaboration. EuroPython
      organiser and lead of the Arm Python Guild, an internal community of
      more than 1,400 Python developers across the company.

experiences:
    title: Career Experience
    info:
      - role: Principal Software Engineer
        time: 2023 - Present
        company: CE-SW Runtimes, Arm Ltd., Cambridge, UK
        details: |
          **Technical Scope**: Tech Lead, CPython.

          Started with a six-month secondment in 2023 to assess the CPython
          ecosystem on Arm platforms, then joined the Runtimes team to continue
          enablement work with upstream collaboration and ecosystem reliability
          for developers. Worked on CPython JIT-related investigations and
          performance work on Arm platforms.
            - Organised the CPython Core Dev Sprint 2025 at Arm in Cambridge
              ([blog post](https://developer.arm.com/community/arm-community-blogs/b/tools-software-ides-blog/posts/cpython-core-dev-sprint-2025-at-arm-cambridge-the-biggest-one-yet)).

      - role: Principal Software Engineer/Staff Software Engineer
        time: 2020 - 2023
        company: ML Group, Arm Ltd., Cambridge, UK
        details: |
          **Technical Scope**: Tech Lead, Python, Machine Learning, IP Evaluation, Inference Advisor, Software Quality.

          Led the open-source [Arm ML Inference Advisor](https://pypi.org/project/mlia/)
          project and coordinated technical delivery across ML and Arm teams.
          Owned design, implementation, and maintenance of ML tooling and
          partner integrations. Previous project: IP Selection Sandbox for ML.
            - Helped AI/ML developers tailor and optimize models for Arm hardware:
              [https://pypi.org/project/mlia/](https://pypi.org/project/mlia/)
            - Built the IP Selection Sandbox for ML, enabling clients to
              evaluate the right IP for workloads.

      - role: Staff Software Engineer
        time: 2017 - 2019
        company: ISG, Arm Ltd., Cambridge, UK
        details: |
          **Technical Scope**: Jenkins/Pipelines, LAVA, Artifactory, Docker, Python, Bash, Linux, GitHub.

          Led build, test, data representation, and validation automation for
          product development. Partnered with global teams and external partners,
          produced system design documents, and improved CI reliability.
            - Designed automated build and test infrastructure from scratch on
              real Cortex-A boards for custom Linux distribution.

      - role: Staff Software Engineer
        time: 2013 - 2017
        company: DSG, Arm Ltd., Cambridge, UK
        details: |
          **Technical Scope**: Python, Flask, Bootstrap, AngularJS, MongoDB,
          Linux, SVN/Git

          Supervised an eight-member team and managed automation infrastructure
          for Arm Compiler and OSS toolchains. Ensured compliance with design
          principles, shared knowledge across teams, and hosted a monthly
          stakeholder forum. Acted as business representative on DSG
          infrastructures.
            - Collaborated with the GNU team to deliver optimized GNU toolchains
              for Arm processors.
            - Drove development of infrastructure for automated builds, tests,
              and benchmarks.
            - Created an application to triage GCC test results, store results
              in a database, and automate issue tracking using Jira.

      - role: Senior Software Engineer
        time: 2011 - 2013
        company: Engineering IT, Arm Ltd., Cambridge, UK
        details: |
          **Technical Scope**: Python, MongoDB, RabbitMQ, Java, Jira, LSF,
          Perl, C, tcsh, bash, Linux, SVN/Git

          Contributed to internal platforms, including a fault-tolerant
          application integrating with an LSF cluster and AMQ server. Built a
          Jira plug-in to synchronize external and internal tickets, and
          maintained core IT systems.
            - Planned and executed the IT Early Career Scheme for interns and
              graduates.

      - role: Software/System Engineer
        time: 2008 - 2011
        company: R&D, Forinicom Srl, Bastia Umbra, IT
        details: |
          **Technical Scope**: Python/Django, PostgreSQL, Debian, XEN, PyQT, Git

          Delivered embedded systems and web solutions for authentication and
          hotspot management. Built a captive portal for sign-up, session logs,
          remote device signals, and payment integration, plus network monitoring
          software.
            - Set up internet connection and enabled fast connectivity for
              rural areas, providing services to hundreds of clients.
            - Designed and implemented hotspot system with captive portal and
              credit card payments for numerous tourists; used at EuroPython 2011.

      - role: Python/Django Engineer
        time: 2006 - 2008
        company: Consorzio Miles, Servizi Integrati, Rome/Assisi, IT
        details: |
          **Technical Scope**: Python/Django, PostgreSQL, Linux

          Worked with a team to replace paper-based processes with a Django web
          system. Led migration from VB to Python/Django, enabling citizens to
          track and update municipal processes online in real time.

